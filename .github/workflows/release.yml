name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/cga-api

jobs:
  relay-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build, sign, and verify CGA-Relay
        shell: pwsh
        env:
          CGA_RELAY_SIGNING_CERT_BASE64: ${{ secrets.CGA_RELAY_SIGNING_CERT_BASE64 }}
          CGA_RELAY_SIGNING_CERT_PASSWORD: ${{ secrets.CGA_RELAY_SIGNING_CERT_PASSWORD }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          .\src\cga-relay\scripts\build-secure-release.ps1 `
            -Version $version `
            -OutputDirectory "$env:RUNNER_TEMP\cga-relay-dist" `
            -RequireSignature

      - name: Upload verified relay assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cga-relay-windows-x64
          path: ${{ runner.temp }}/cga-relay-dist/*
          if-no-files-found: error

  publish:
    needs: relay-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download verified relay assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cga-relay-windows-x64
          path: relay-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.ref_name }}
            ${{ env.API_IMAGE }}:latest

      - name: Create source bundle and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="cga-${version}.tar.gz"
          git archive --format=tar.gz --prefix="cga-${version}/" -o "$archive" HEAD
          sha256sum "$archive" docker-compose.release.yml .env.example > SHA256SUMS.txt
          # action-gh-release uploads each configured path using its basename.
          (
            cd relay-dist
            sha256sum cga-relay.exe "cga-relay-${version}-windows-x64.zip"
          ) >> SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            cga-*.tar.gz
            relay-dist/*
            docker-compose.release.yml
            .env.example
            SHA256SUMS.txt