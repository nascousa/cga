name: Policy CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  relay-reliability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cga-relay
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test Relay
        run: cargo test --locked
      - name: Test Unix user installers
        if: runner.os != 'Windows'
        run: python3 scripts/tests/test_unix_install.py
      - name: Verify Linux tray dependencies and helpers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 libsecret-tools gnome-keyring xvfb xauth dbus-x11
          /usr/bin/python3 -m py_compile desktop/linux/tray.py
          dbus-run-session -- xvfb-run -a /usr/bin/python3 desktop/linux/test_tray.py
      - name: Test native Linux credential persistence
        if: runner.os == 'Linux'
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME
          HOME="$(mktemp -d "$RUNNER_TEMP/relay-keyring.XXXXXX")"
          dbus-run-session -- sh -c '
            printf "ci-ephemeral-keyring\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked --test credential_sessions native_secret_service -- --ignored
          '
      - name: Build native Unix candidate
        if: runner.os != 'Windows'
        run: sh scripts/build-unix-package.sh "$RUNNER_TEMP/relay-candidate"
      - name: Smoke-test installed Unix candidate
        if: runner.os != 'Windows'
        run: |
          package="$(find "$RUNNER_TEMP/relay-candidate" -mindepth 1 -maxdepth 1 -type d -name '*-candidate')"
          python3 scripts/tests/smoke_unix_package.py "$package"
      - name: Upload native Unix candidate
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/relay-candidate/*-candidate.*
          if-no-files-found: error
      - name: Verify hardened Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\verify-release-binary.ps1 -BinaryPath .\target\x86_64-pc-windows-msvc\release\cga-relay.exe
          .\scripts\tests\release-process.Tests.ps1

  quality-security:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 16379:6379
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Check product version alignment
        run: |
          python src/scripts/bump_version.py --check
          python src/scripts/check_change_logs.py
        env:
          CGA_CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Run tests with coverage gate
        id: coverage
        continue-on-error: true
        env:
          RELAY_SYNC_TEST_POSTGRES_DSN: postgresql://localhost:15432/appdb
          PGUSER: app
          PGPASSWORD: app
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "16379"
          QUEUE_REDIS_URL: redis://localhost:6380/1
          CACHE_REDIS_URL: redis://localhost:6380
          BACKUP_DIR: ${{ github.workspace }}/data/backups
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          pytest --cov=src --cov-report=term-missing --cov-fail-under=50 2>&1 | tee .ci-logs/coverage.log

      - name: Run live graph smoke tests
        id: smoke
        continue-on-error: true
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "16379"
          QUEUE_REDIS_URL: redis://localhost:6380/1
          CACHE_REDIS_URL: redis://localhost:6380
          BACKUP_DIR: ${{ github.workspace }}/data/backups
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          pytest -m live_graph_smoke -q 2>&1 | tee .ci-logs/live_graph_smoke.log

      - name: Run live graph end-to-end tests
        id: e2e
        continue-on-error: true
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "16379"
          QUEUE_REDIS_URL: redis://localhost:6380/1
          CACHE_REDIS_URL: redis://localhost:6380
          BACKUP_DIR: ${{ github.workspace }}/data/backups
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          pytest -m live_graph_e2e -q 2>&1 | tee .ci-logs/live_graph_e2e.log

      - name: Summarize test lanes
        if: always()
        run: |
          {
            echo "## Test Lane Summary"
            echo ""
            echo "- coverage: ${{ steps.coverage.outcome }}"
            echo "- live_graph_smoke: ${{ steps.smoke.outcome }}"
            echo "- live_graph_e2e: ${{ steps.e2e.outcome }}"
            echo ""
            if [[ "${{ steps.coverage.outcome }}" != "success" ]]; then
              echo "### coverage failure (tail)"
              echo '```text'
              tail -n 80 .ci-logs/coverage.log || true
              echo '```'
              echo ""
            fi
            if [[ "${{ steps.smoke.outcome }}" != "success" ]]; then
              echo "### live_graph_smoke failure (tail)"
              echo '```text'
              tail -n 80 .ci-logs/live_graph_smoke.log || true
              echo '```'
              echo ""
            fi
            if [[ "${{ steps.e2e.outcome }}" != "success" ]]; then
              echo "### live_graph_e2e failure (tail)"
              echo '```text'
              tail -n 80 .ci-logs/live_graph_e2e.log || true
              echo '```'
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lane logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lane-logs
          path: .ci-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce test lane success
        if: always()
        run: |
          if [[ "${{ steps.coverage.outcome }}" != "success" || "${{ steps.smoke.outcome }}" != "success" || "${{ steps.e2e.outcome }}" != "success" ]]; then
            echo "One or more test lanes failed. See Test Lane Summary above."
            exit 1
          fi

      - name: Run dependency vulnerability audit
        run: |
          pip-audit -r requirements.txt

      - name: Build and smoke-test the desktop API image
        run: |
          docker build -f Dockerfile.dev -t cga-ci-api .
          docker run --rm --network none --entrypoint python cga-ci-api \
            -c "from backend.main import APP_VERSION, app; from backend.indexer.parser import SourceParser; print(APP_VERSION)"

  pr-policy-checklist:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR policy checklist text
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "PR body is empty. Fill in the policy checklist in the PR template."
            exit 1
          fi

          if echo "$PR_BODY" | grep -Eqi "no[[:space:]].*changes[[:space:]]+expected" \
            && echo "$PR_BODY" | grep -Eqi "database|api contract|infrastructure|secret"; then
            echo "Policy checklist bypassed: PR body explicitly states no database/API/infrastructure/secret changes."
            exit 0
          fi

          echo "$PR_BODY" | grep -qi "JWT/token entropy policy applied" || {
            echo "Missing JWT/token entropy checklist item in PR body."
            exit 1
          }

          echo "$PR_BODY" | grep -qi "Data policy applied for pgvector/sqlite-vec/graph" || {
            echo "Missing data policy checklist item in PR body."
            exit 1
          }
